<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#2a1b4e"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Subtle glow ring -->
  <circle cx="390" cy="120" r="160" fill="url(#accentGrad)" opacity="0.12" filter="blur(40px)"/>

  <!-- Logo Graphics: Modern "JS" monogram -->
  <g filter="url(#glow)">
    <!-- J Letter -->
    <path d="M 175 140
             H 230
             V 285
             C 230 335, 195 365, 140 365
             C 105 365, 75 350, 60 330
             L 92 292
             C 102 305, 118 315, 138 315
             C 162 315, 175 300, 175 278
             Z"
          fill="#ffffff"/>

    <!-- S Letter -->
    <path d="M 435 205
             L 392 235
             C 380 215, 362 200, 335 200
             C 308 200, 290 214, 290 234
             C 290 252, 305 264, 345 275
             C 395 289, 435 308, 435 355
             C 435 408, 388 440, 328 440
             C 275 440, 235 410, 215 370
             L 260 340
             C 275 365, 300 385, 330 385
             C 358 385, 378 370, 378 350
             C 378 330, 362 320, 320 308
             C 270 294, 235 275, 235 230
             C 235 180, 280 148, 338 148
             C 382 148, 415 170, 435 205
             Z"
          fill="url(#primaryGrad)"/>

    <!-- Tech dot / accent representing "BY MA" -->
    <circle cx="395" cy="115" r="22" fill="#38bdf8"/>
  </g>
</svg>
